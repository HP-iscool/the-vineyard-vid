<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #0f0f0f;
  --panel: #181818;
  --text: #f1f1f1;
  --sub: #aaaaaa;
  --line: #303030;
  --green: #397653;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, "Malgun Gothic", sans-serif;
  font-size: 14px;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

.topbar {
  height: 62px;
  padding: 0 5%;
  display: flex;
  align-items: center;
  gap: 28px;
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
}

.menu-button, .more-button {
  background: none;
  border: 0;
  color: var(--text);
  font-size: 24px;
  padding: 5px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 21px;
  font-weight: bold;
  white-space: nowrap;
}

.brand svg {
  width: 31px;
  height: 24px;
}

.searchbar {
  display: flex;
  margin: 0 auto;
  width: min(520px, 48%);
  height: 40px;
}

.searchbar input {
  min-width: 0;
  flex: 1;
  padding: 0 17px;
  border: 1px solid #303030;
  border-radius: 22px 0 0 22px;
  background: #121212;
  color: white;
  outline: none;
}

.searchbar button {
  width: 65px;
  border: 1px solid #303030;
  border-left: 0;
  border-radius: 0 22px 22px 0;
  background: #222;
  color: white;
}

.page {
  width: min(1120px, 92%);
  margin: 25px auto 60px;
}

.video {
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 13px;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.video svg {
  width: 66px;
  height: 48px;
  opacity: 0.95;
}

.video-info {
  padding-top: 18px;
}

.video-title {
  font-size: 21px;
  line-height: 1.5;
  font-weight: 700;
  margin: 0 0 17px;
}

.channel-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.avatar {
  width: 43px;
  height: 43px;
  border-radius: 50%;
  background: var(--green);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.avatar svg {
  width: 31px;
  height: 31px;
}

.channel-details {
  flex: 1;
  min-width: 120px;
}

.channel-name {
  font-weight: bold;
  font-size: 15px;
  margin-bottom: 5px;
}

.channel-handle {
  color: var(--sub);
  font-size: 12px;
}

.subscribe {
  border: none;
  border-radius: 22px;
  padding: 11px 17px;
  color: #0f0f0f;
  background: #f1f1f1;
  font-weight: bold;
}

.actions {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  margin-top: 18px;
}

.pill {
  border: none;
  border-radius: 22px;
  background: #272727;
  color: var(--text);
  padding: 10px 15px;
}

.pill:hover {
  background: #3a3a3a;
}

.description {
  background: #272727;
  padding: 13px 15px;
  margin-top: 17px;
  border-radius: 12px;
  line-height: 1.7;
}

.comments {
  margin-top: 30px;
}

.comments-header {
  display: flex;
  align-items: center;
  gap: 22px;
  margin-bottom: 22px;
}

.comments-header h2 {
  font-size: 19px;
  margin: 0;
}

.sort {
  background: transparent;
  border: 0;
  color: var(--text);
  font-weight: bold;
}

.pinned {
  background: #1b1b1b;
  border: 1px solid #303030;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 27px;
}

.pin-label {
  color: var(--sub);
  font-size: 12px;
  margin-bottom: 13px;
}

.comment {
  display: flex;
  align-items: flex-start;
  gap: 13px;
  margin: 24px 0;
}

.comment-avatar {
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #252525;
  font-weight: bold;
  font-size: 14px;
}

.comment-body {
  min-width: 0;
  flex: 1;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.comment-user {
  font-weight: bold;
  font-size: 13px;
  margin-bottom: 5px;

.comment-time {
  color: var(--sub);
  font-weight: normal;
  margin-left: 5px;
}

.comment-text {

}

.comment-actions {

  align-items: center;
  gap: 19px;

}

.comment-actions button {

}

.replies {

}

.reply {

  font-size: 13px;
}

.reply-name {
  font-weight: bold;
  margin-bottom: 3px;
}

.reply-name span {
  color: var(--sub);

.load-more {

  background: transparent;
  border: 1px solid #444;
  color: var(--text);
  padding: 13px;
  border-radius: 24px;
  margin-top: 10px;

footer {

  text-align: center;
  font-size: 11px;
  padding: 25px 10px;

/* 모바일 화면 */
@media (max-width: 600px) {

</style>

  },
  {

    text: "어? 입구 저렇게 생겼었나",
    likes: 3,
    replies: [
      ["포장마차", "입구가 따로 있어요?? 전 아직 못 봤는데"],
      ["닉네임뭐하지", "아니 그... 나중에 직접 해 보면 알 거예요"]
    ]
  },
  {
    name: "퇴근시켜줘", time: "1일 전", color: "#e5ead8", icon: "퇴",
    text: "이런 게임은 밤에 하면 안 됨... 정신 차리면 아침임",
    likes: 5
  },
  {
    name: "월요일싫어", time: "1일 전", color: "#dce7f2", icon: "월",
    text: "날짜 넘어가는 거 저렇게 바로 넘어가요? 저는 가끔 하루 더 한 것처럼 느껴지던데",
    likes: 9
  },
  {
    name: "라면물조절실패", time: "1일 전", color: "#eadff0", icon: "라",

    likes: 4
  },
  {

    text: "피터님 농사겜 하면 원래 이렇게 집중했나ㅋㅋㅋ 평소보다 조용해서 신기하네",

    likes: 2
  }
];

const list = document.getElementById("commentList");
let shown = 8;
let newestFirst = false;

function renderComments() {
  list.innerHTML = "";

  const ordered = [...comments];
  if (newestFirst) ordered.reverse();

  ordered.slice(0, shown).forEach(c => {
    const article = document.createElement("article");
    article.className = "comment";

    const avatar = document.createElement("div");
    avatar.className = "comment-avatar";
    avatar.style.background = c.color;
    avatar.textContent = c.icon;

    const body = document.createElement("div");
    body.className = "comment-body";

    const user = document.createElement("div");
    user.className = "comment-user";
    user.textContent = c.name;

    const time = document.createElement("span");
    time.className = "comment-time";
    time.textContent = "· " + c.time;
    user.appendChild(time);

    const text = document.createElement("div");
    text.className = "comment-text";
    text.textContent = c.text;

    const actions = document.createElement("div");
    actions.className = "comment-actions";

    const like = document.createElement("button");
    like.textContent = "♡ " + c.likes;
    like.onclick = () => {
      c.likes++;
      like.textContent = "♥ " + c.likes;
      like.style.color = "#ff6b81";
      like.disabled = true;
    };

    const replyLabel = document.createElement("span");
    replyLabel.textContent = c.replies ? "답글 " + c.replies.length + "개" : "답글";

    actions.append(like, replyLabel);
    body.append(user, text, actions);

    if (c.replies) {
      const replies = document.createElement("div");
      replies.className = "replies";

      c.replies.forEach(r => {
        const reply = document.createElement("div");
        reply.className = "reply";

        const name = document.createElement("div");
        name.className = "reply-name";
        name.textContent = r[0];

        const replyText = document.createElement("div");
        replyText.textContent = r[1];

        reply.append(name, replyText);
        replies.appendChild(reply);
      });

      body.appendChild(replies);
    }

    article.append(avatar, body);
    list.appendChild(article);
  });

  document.getElementById("loadMore").style.display =
    shown >= comments.length ? "none" : "block";
}

document.getElementById("loadMore").addEventListener("click", () => {
  shown = comments.length;
  renderComments();
});

document.getElementById("sortButton").addEventListener("click", () => {
  newestFirst = !newestFirst;
  document.getElementById("sortButton").textContent =
    newestFirst ? "☰ 최신 댓글순" : "☰ 인기 댓글순";
  renderComments();
});

document.getElementById("searchForm").addEventListener("submit", e => {
  e.preventDefault();
});

document.getElementById("subscribeButton").addEventListener("click", e => {
  const button = e.currentTarget;
  const subscribed = button.textContent === "구독 중";
  button.textContent = subscribed ? "구독" : "구독 중";
  button.style.background = subscribed ? "#f1f1f1" : "#333";
  button.style.color = subscribed ? "#0f0f0f" : "#fff";
});

document.getElementById("likeButton").addEventListener("click", e => {
  const button = e.currentTarget;
  const liked = button.dataset.liked === "true";
  button.dataset.liked = String(!liked);
  button.innerHTML = (liked ? "♡ 좋아요 " : "♥ 좋아요 ") +
    '<span id="likeCount">' + (liked ? "1.2천" : "1.2천") + "</span>";
});


document.getElementById("shareButton").addEventListener("click", () => {
  document.getElementById("shareModal").classList.add("show");
});
document.getElementById("shareUrl").textContent = window.location.href;

document.getElementById("closeShare").addEventListener("click", () => {
  document.getElementById("shareModal").classList.remove("show");
});

document.getElementById("copyShare").addEventListener("click", async () => {
  const url = window.location.href;
  const message = document.getElementById("copyMessage");

  try {
    await navigator.clipboard.writeText(url);
    message.textContent = "링크를 복사했어요!";
  } catch (error) {
    message.textContent = "주소창에서 링크를 복사해 주세요.";
  }
});

document.getElementById("shareModal").addEventListener("click", (event) => {
  if (event.target.id === "shareModal") {
    event.currentTarget.classList.remove("show");
  }
});


document.getElementById("saveButton").addEventListener("click", e => {
  e.currentTarget.textContent =
    e.currentTarget.textContent.includes("저장됨") ? "▤ 저장" : "✓ 저장됨";
});

renderComments();
</script>

</body>
</html>
